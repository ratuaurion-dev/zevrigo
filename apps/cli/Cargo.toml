[package]
name = "zevrigo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "zevrigo-cli"
path = "src/main.rs"

[dependencies]
zevrigo-primitives.workspace = true
zevrigo-rpc.workspace = true
# DEC-21: frasa, kunci, alamat, pemilihan koin, dan tanda tangan dari MOD-09.
zevrigo-wallet-core.workspace = true
# DEC-27: password wallet dibaca dari terminal tanpa tampil di layar; password dihapus dari memori sesudah dipakai.
rpassword.workspace = true
# DEC-10 bagian 11 (DEC-31): sumber acak sistem operasi di Unix dan Windows.
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
