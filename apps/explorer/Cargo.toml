[package]
name = "homeostasis-explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "homeostasis-explorer"
path = "src/main.rs"

[dependencies]
# DEC-25 bagian 2: MOD-01, 02, 04, 08, 09 (MOD-09 dipakai mulai TSK-M30). MOD-05 tidak dipakai.
homeostasis-consensus.workspace = true
homeostasis-crypto.workspace = true
homeostasis-primitives.workspace = true
homeostasis-rpc.workspace = true
# DEC-10 bagian 6: SQLite 3.54.1 ikut dikompilasi (fitur `bundled`); fitur bawaan rusqlite tidak dipakai.
# `fallible_uint`: u64 dan usize lewat konversi i64 yang diperiksa (galat jika di luar jangkauan), tanpa paket baru.
rusqlite = { workspace = true, features = ["bundled", "fallible_uint"] }
thiserror.workspace = true

[lints]
workspace = true
