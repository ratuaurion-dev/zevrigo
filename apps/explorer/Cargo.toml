[package]
name = "homeostasis-explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "homeostasis-explorer"
path = "src/main.rs"

[dependencies]
# DEC-10 bagian 6: API HTTP. Hanya `http1` dan `tokio`; Json, Query, dan fitur bawaan lain tidak dipakai.
axum = { workspace = true, features = ["http1", "tokio"] }
# DEC-25 bagian 2: MOD-01, 02, 04, 08. MOD-05 tidak dipakai; MOD-09 (alamat) tidak dipakai lagi sejak DEC-28.
homeostasis-consensus.workspace = true
homeostasis-crypto.workspace = true
homeostasis-primitives.workspace = true
homeostasis-rpc.workspace = true
# DEC-10 bagian 6: SQLite 3.54.1 ikut dikompilasi (fitur `bundled`); fitur bawaan rusqlite tidak dipakai.
# `fallible_uint`: u64 dan usize lewat konversi i64 yang diperiksa (galat jika di luar jangkauan), tanpa paket baru.
rusqlite = { workspace = true, features = ["bundled", "fallible_uint"] }
serde_json.workspace = true
# DEC-10 bagian 4 (TSK-M38): SHA-256 untuk hash skrip inline halaman Next.js di kebijakan keamanan konten (`web`).
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
